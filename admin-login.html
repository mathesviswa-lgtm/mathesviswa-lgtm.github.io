<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Owner Login | Anamigam Journal</title>
<meta name="description" content="Anamigam Journal - Owner Login">
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" href="logo.png">

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#f7f3eb;
  --card:#fffdf8;
  --text:#24211d;
  --muted:#756f66;
  --line:#ddd5c8;
  --accent:#8b5e3c;
  --shadow:0 18px 50px rgba(45,35,25,.08);
  --error:#c92a2a;
  --success:#51a851;
}

body.dark {
  --bg:#151412;
  --card:#201e1b;
  --text:#f4eee4;
  --muted:#b8afa2;
  --line:#3a352e;
  --accent:#d19a6a;
  --shadow:0 18px 50px rgba(0,0,0,.25);
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  font-family:Georgia,"Noto Serif Tamil",serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container {
  max-width:450px;
  width:100%;
  padding:25px;
}

.login-header {
  text-align:center;
  margin-bottom:40px;
}

.logo-link {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  margin-bottom:25px;
  text-decoration:none;
  color:var(--text);
}

.logo-img {
  height:48px;
  width:auto;
}

.logo-text {
  font-size:20px;
  font-weight:bold;
}

.logo-text span {
  color:var(--accent);
}

.login-header h1 {
  font-size:32px;
  margin-bottom:10px;
}

.login-header p {
  color:var(--muted);
  font-size:15px;
}

.login-box {
  background:var(--card);
  border:1px solid var(--line);
  padding:42px;
  box-shadow:var(--shadow);
}

.form-group {
  margin-bottom:22px;
}

label {
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

input {
  width:100%;
  padding:13px 14px;
  background:var(--bg);
  border:1px solid var(--line);
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  outline:none;
}

input:focus {
  border-color:var(--accent);
}

.btn-login {
  width:100%;
  padding:14px 22px;
  background:var(--text);
  color:var(--bg);
  border:1px solid var(--text);
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin-top:8px;
}

.btn-login:disabled {
  opacity:.6;
  cursor:not-allowed;
}

.alert {
  padding:14px 16px;
  margin-bottom:20px;
  font-size:13px;
  display:none;
}

.alert.show {
  display:block;
}

.alert-error {
  background:rgba(201,42,42,.12);
  border:1px solid rgba(201,42,42,.3);
  color:var(--error);
}

.alert-success {
  background:rgba(81,168,81,.12);
  border:1px solid rgba(81,168,81,.3);
  color:var(--success);
}

.alert-info {
  background:rgba(139,94,60,.12);
  border:1px solid rgba(139,94,60,.3);
  color:var(--accent);
}

.divider {
  text-align:center;
  margin:30px 0;
  color:var(--muted);
  font-size:12px;
}

.login-footer {
  text-align:center;
  font-size:13px;
  color:var(--muted);
}

.login-footer a {
  color:var(--accent);
  text-decoration:none;
}

.theme-toggle {
  position:fixed;
  top:20px;
  right:20px;
  width:40px;
  height:40px;
  border:1px solid var(--line);
  border-radius:50%;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

@media(max-width:480px) {

  .container {
    padding:15px;
  }

  .login-box {
    padding:28px;
  }

  .login-header h1 {
    font-size:27px;
  }

}
</style>
</head>

<body>

<button
  class="theme-toggle"
  onclick="toggleTheme()"
  title="Dark / Light Mode">
  ☾
</button>

<div class="container">

  <div class="login-header">

    <a href="index.html" class="logo-link">

      <img
        src="logo.png"
        alt="Anamigam Journal"
        class="logo-img">

      <div class="logo-text">
        Anamigam <span>Journal</span>
      </div>

    </a>

    <h1>Owner Login</h1>

    <p>
      Access your content management dashboard
    </p>

  </div>


  <div class="login-box">

    <div
      id="errorAlert"
      class="alert alert-error">
    </div>

    <div
      id="successAlert"
      class="alert alert-success">
    </div>

    <div
      id="infoAlert"
      class="alert alert-info">
    </div>


    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          required
          autocomplete="email">

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="••••••••"
          required
          autocomplete="current-password">

      </div>


      <button
        type="submit"
        class="btn-login"
        id="submitBtn">

        Sign In

      </button>

    </form>


    <div class="divider">
      Anamigam Journal
    </div>


    <div class="login-footer">

      <p>
        Protected admin area.
        Unauthorized access is prohibited.
      </p>

      <p style="margin-top:12px;">

        <a href="index.html">
          ← Back to Anamigam Journal
        </a>

      </p>

    </div>

  </div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

/*
  IMPORTANT:
  Use the Project URL from the CURRENT
  Supabase project.

  Do NOT add /rest/v1/
*/

const SUPABASE_URL =
  'https://tscmbnaystpjioflkeey.supabase.co';


/*
  IMPORTANT:
  Paste the PUBLISHABLE KEY from THIS SAME
  Supabase project.

  Do NOT use the old project's key.
  Do NOT use service_role / secret key.
*/

const SUPABASE_ANON_KEY =
  'YOUR_CURRENT_PROJECT_PUBLISHABLE_KEY';


/* =========================================
   SUPABASE CLIENT
========================================= */

if (
  !window.supabase ||
  typeof window.supabase.createClient !== 'function'
) {

  document.getElementById('errorAlert').textContent =
    'Supabase library failed to load. Please refresh the page.';

  document.getElementById('errorAlert')
    .classList.add('show');

  throw new Error(
    'Supabase JavaScript library unavailable.'
  );

}


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const loginForm =
  document.getElementById('loginForm');

const submitBtn =
  document.getElementById('submitBtn');


/* =========================================
   CHECK EXISTING SESSION
========================================= */

async function checkExistingSession() {

  try {

    const {
      data,
      error
    } = await db.auth.getSession();


    if (error) {

      console.error(
        'Session error:',
        error
      );

      return;

    }


    if (data && data.session) {

      showInfo(
        'Already signed in. Redirecting...'
      );


      setTimeout(() => {

        window.location.href =
          'admin.html';

      },500);

    }

  } catch(error) {

    console.error(
      'Session check error:',
      error
    );

  }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  'submit',
  async function(event) {

    event.preventDefault();

    clearAlerts();


    const email =
      document.getElementById(
        'email'
      ).value.trim();


    const password =
      document.getElementById(
        'password'
      ).value;


    if (!email || !password) {

      showError(
        'Please enter your email and password.'
      );

      return;

    }


    submitBtn.disabled = true;

    submitBtn.textContent =
      'Signing in...';


    try {

      const {
        data,
        error
      } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        console.error(
          'Supabase login error:',
          error
        );


        showError(
          error.message ||
          'Login failed. Please try again.'
        );


        submitBtn.disabled = false;

        submitBtn.textContent =
          'Sign In';

        return;

      }


      if (data && data.session) {

        showSuccess(
          'Login successful! Redirecting...'
        );


        setTimeout(() => {

          window.location.href =
            'admin.html';

        },800);

      } else {

        showError(
          'Login completed but no session was created.'
        );


        submitBtn.disabled = false;

        submitBtn.textContent =
          'Sign In';

      }

    } catch(error) {

      console.error(
        'Login exception:',
        error
      );


      showError(
        error.message ||
        'Unable to connect to authentication service.'
      );


      submitBtn.disabled = false;

      submitBtn.textContent =
        'Sign In';

    }

  }
);


/* =========================================
   ALERT FUNCTIONS
========================================= */

function showError(message) {

  const el =
    document.getElementById(
      'errorAlert'
    );

  el.textContent =
    message;

  el.classList.add('show');

}


function showSuccess(message) {

  const el =
    document.getElementById(
      'successAlert'
    );

  el.textContent =
    message;

  el.classList.add('show');

}


function showInfo(message) {

  const el =
    document.getElementById(
      'infoAlert'
    );

  el.textContent =
    message;

  el.classList.add('show');

}


function clearAlerts() {

  document
    .getElementById('errorAlert')
    .classList.remove('show');

  document
    .getElementById('successAlert')
    .classList.remove('show');

  document
    .getElementById('infoAlert')
    .classList.remove('show');

}


/* =========================================
   THEME
========================================= */

function toggleTheme() {

  document.body.classList.toggle('dark');


  localStorage.setItem(
    'anamigam-theme',
    document.body.classList.contains('dark')
      ? 'dark'
      : 'light'
  );

}


if (
  localStorage.getItem(
    'anamigam-theme'
  ) === 'dark'
) {

  document.body.classList.add('dark');

}


/* =========================================
   START
========================================= */

checkExistingSession();

</script>

</body>
</html>
