<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard — Anamigam Journal</title>
<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f7f3eb;
  --card:#fffdf8;
  --text:#26261f;
  --muted:#77746a;
  --border:#ddd7ca;
  --accent:#66734f;
  --danger:#a94442;
  --shadow:0 10px 30px rgba(40,35,25,.08);
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Noto Serif Tamil",serif;
}

body.dark{
  --bg:#151612;
  --card:#20211d;
  --text:#f2efe7;
  --muted:#aaa79d;
  --border:#393a34;
  --accent:#aab98b;
  --danger:#ef8b87;
  --shadow:0 10px 30px rgba(0,0,0,.3);
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(247,243,235,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}

.dark header{
  background:rgba(21,22,18,.94);
}

.nav{
  max-width:1250px;
  margin:auto;
  padding:13px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:bold;
  letter-spacing:1px;
}

.logo img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
}

.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:white;
}

.btn.danger{
  color:var(--danger);
}

.container{
  max-width:1250px;
  margin:auto;
  padding:35px 20px 70px;
}

.hero{
  margin-bottom:25px;
}

.hero h1{
  margin:0 0 8px;
  font-size:clamp(30px,5vw,48px);
}

.hero p{
  margin:0;
  color:var(--muted);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  box-shadow:var(--shadow);
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:14px;
}

.stat strong{
  display:block;
  font-size:32px;
  margin-top:7px;
}

.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:22px;
}

.panel h2{
  margin-top:0;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:20px;
}

.tab{
  white-space:nowrap;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.tab.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  font:inherit;
}

textarea{
  min-height:150px;
  resize:vertical;
}

.check-row{
  display:flex;
  gap:20px;
  align-items:center;
  margin-top:15px;
}

.check{
  display:flex;
  gap:7px;
  align-items:center;
}

.check input{
  width:auto;
}

.form-actions{
  display:flex;
  gap:8px;
  margin-top:18px;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.toolbar input{
  flex:1;
}

.items{
  display:grid;
  gap:12px;
}

.item{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:14px;
  padding:17px;
}

.item-title{
  font-size:19px;
  font-weight:bold;
  margin-bottom:6px;
}

.meta{
  color:var(--muted);
  font-size:14px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border:1px solid var(--border);
  border-radius:20px;
  font-size:12px;
  margin:8px 5px 0 0;
}

.item-actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px;
}

.message{
  margin-top:12px;
  color:var(--accent);
}

.hidden{
  display:none!important;
}

.loading{
  text-align:center;
  padding:25px;
  color:var(--muted);
}

@media(max-width:900px){
  .stats{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:700px){
  .form-grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .logo span{
    display:none;
  }

  .nav{
    padding:12px 15px;
  }

  .nav-actions .website{
    display:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">
      <img src="logo.png" alt="Anamigam Journal">
      <span>ANAMIGAM JOURNAL</span>
    </div>

    <div class="nav-actions">
      <a class="btn website" href="index.html">Website</a>
      <button class="btn" id="themeBtn">☾</button>
      <button class="btn danger" id="logoutBtn">Logout</button>
    </div>

  </div>
</header>


<main class="container">

<section class="hero">
  <h1>Admin Dashboard</h1>
  <p>அனாமிகம் ஜர்னலின் முழு உள்ளடக்க நிர்வாகம்.</p>
</section>


<!-- STATS -->

<section class="stats">

  <div class="stat">
    <span>Writings</span>
    <strong id="writingCount">—</strong>
  </div>

  <div class="stat">
    <span>E-Books</span>
    <strong id="ebookCount">—</strong>
  </div>

  <div class="stat">
    <span>Achievements</span>
    <strong id="achievementCount">—</strong>
  </div>

  <div class="stat">
    <span>Journal</span>
    <strong id="journalCount">—</strong>
  </div>

</section>


<!-- ADD / EDIT -->

<section class="panel">

<h2 id="formTitle">Add New Content</h2>

<div class="tabs">

  <button class="tab active" data-type="Writing">
    ✍️ Writing
  </button>

  <button class="tab" data-type="E-book">
    📚 E-Book
  </button>

  <button class="tab" data-type="Achievement">
    🏆 Achievement
  </button>

  <button class="tab" data-type="Journal">
    📰 Journal
  </button>

</div>


<form id="contentForm">

<div class="form-grid">

  <div>
    <label>Title</label>
    <input id="title" required>
  </div>

  <div>
    <label>Author</label>
    <input id="author">
  </div>

  <div>
    <label>Category</label>
    <input id="category" placeholder="கவிதை / சிறுகதை / கட்டுரை">
  </div>

  <div>
    <label>Status</label>
    <select id="status">
      <option value="draft">Draft</option>
      <option value="published">Published</option>
    </select>
  </div>

  <div class="full">
    <label>Description / Content</label>
    <textarea id="content"></textarea>
  </div>

  <div>
    <label>File URL / PDF URL</label>
    <input id="fileUrl">
  </div>

  <div>
    <label>Cover / Image URL</label>
    <input id="imageUrl">
  </div>

</div>


<div class="check-row">

  <label class="check">
    <input type="checkbox" id="featured">
    Featured
  </label>

</div>


<div class="form-actions">

  <button class="btn primary" type="submit" id="saveBtn">
    Save
  </button>

  <button class="btn hidden" type="button" id="cancelBtn">
    Cancel
  </button>

</div>

<div class="message" id="message"></div>

</form>

</section>


<!-- CONTENT -->

<section class="panel">

<h2>Manage Content</h2>

<div class="toolbar">

  <input
    id="search"
    placeholder="Search..."
  >

  <select id="listFilter">

    <option value="Writing">
      Writings
    </option>

    <option value="E-book">
      E-Books
    </option>

    <option value="Achievement">
      Achievements
    </option>

    <option value="Journal">
      Journal
    </option>

  </select>

</div>

<div id="items" class="items">
  <div class="loading">Loading...</div>
</div>

</section>

</main>


<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
'https://msgwhxeqnljmbzalnawe.supabase.co';';

const SUPABASE_ANON_KEY =
  'sb_publishable_862-UtuOzY14PCtKYVvjEA_sPTK1FPd';

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================
   STATE
========================================= */

let currentType = 'Writing';
let editingId = null;
let allData = [];


/* =========================================
   TABLE MAP
========================================= */

const tables = {
  'Writing':'writings',
  'E-book':'ebooks',
  'Achievement':'achievements',
  'Journal':'journal_posts'
};


/* =========================================
   AUTH
========================================= */

async function checkAuth(){

  const { data, error } =
    await db.auth.getSession();

  if(error || !data.session){

    window.location.href =
      'admin-login.html';

    return false;
  }

  return true;
}


/* =========================================
   TABS
========================================= */

document.querySelectorAll('.tab')
.forEach(tab => {

  tab.addEventListener('click', () => {

    document.querySelectorAll('.tab')
    .forEach(x =>
      x.classList.remove('active')
    );

    tab.classList.add('active');

    currentType =
      tab.dataset.type;

    document.getElementById(
      'listFilter'
    ).value = currentType;

    resetForm();

    loadData();

  });

});


/* =========================================
   LOAD DATA
========================================= */

async function loadData(){

  const table =
    tables[currentType];

  const items =
    document.getElementById('items');

  items.innerHTML =
    '<div class="loading">Loading...</div>';

  const { data, error } =
    await db
      .from(table)
      .select('*')
      .order(
        'created_at',
        { ascending:false }
      );

  if(error){

    console.error(error);

    items.innerHTML =
      '<div class="empty">Unable to load content.</div>';

    return;
  }

  allData = data || [];

  renderData();

  updateCounts();

}


/* =========================================
   RENDER
========================================= */

function renderData(){

  const search =
    document.getElementById(
      'search'
    ).value
    .toLowerCase()
    .trim();

  let data =
    allData.filter(item => {

      return !search ||
        (item.title || '')
          .toLowerCase()
          .includes(search) ||

        (item.category || '')
          .toLowerCase()
          .includes(search) ||

        (item.author || '')
          .toLowerCase()
          .includes(search);

    });


  const items =
    document.getElementById(
      'items'
    );


  if(!data.length){

    items.innerHTML =
      '<div class="empty">No content found.</div>';

    return;
  }


  items.innerHTML =
    data.map(item => {

      return `
        <article class="item">

          <div class="item-title">
            ${escapeHtml(item.title || 'Untitled')}
          </div>

          <div class="meta">
            ${escapeHtml(item.author || '')}
            ${item.category
              ? ' • ' + escapeHtml(item.category)
              : ''}
          </div>

          <span class="badge">
            ${escapeHtml(item.status || 'draft')}
          </span>

          ${
            item.featured
            ? '<span class="badge">⭐ Featured</span>'
            : ''
          }

          <div class="item-actions">

            <button
              class="btn"
              onclick="editItem('${item.id}')">
              Edit
            </button>

            <button
              class="btn danger"
              onclick="deleteItem('${item.id}')">
              Delete
            </button>

          </div>

        </article>
      `;

    }).join('');

}


/* =========================================
   EDIT
========================================= */

window.editItem = function(id){

  const item =
    allData.find(
      x => x.id === id
    );

  if(!item) return;

  editingId = id;

  document.getElementById(
    'formTitle'
  ).textContent =
    'Edit Content';

  document.getElementById(
    'title'
  ).value =
    item.title || '';

  document.getElementById(
    'author'
  ).value =
    item.author || '';

  document.getElementById(
    'category'
  ).value =
    item.category || '';

  document.getElementById(
    'content'
  ).value =
    item.content ||
    item.description ||
    '';

  document.getElementById(
    'status'
  ).value =
    item.status ||
    'draft';

  document.getElementById(
    'featured'
  ).checked =
    !!item.featured;

  document.getElementById(
    'fileUrl'
  ).value =
    item.file_url || '';

  document.getElementById(
    'imageUrl'
  ).value =
    item.cover_url ||
    item.image_url ||
    '';

  document.getElementById(
    'cancelBtn'
  ).classList.remove('hidden');

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

};


/* =========================================
   SAVE
========================================= */

document.getElementById(
  'contentForm'
).addEventListener(
  'submit',
  async e => {

    e.preventDefault();

    const saveBtn =
      document.getElementById(
        'saveBtn'
      );

    saveBtn.disabled = true;

    saveBtn.textContent =
      'Saving...';


    const base = {

      title:
        document.getElementById(
          'title'
        ).value.trim(),

      author:
        document.getElementById(
          'author'
        ).value.trim(),

      category:
        document.getElementById(
          'category'
        ).value.trim(),

      status:
        document.getElementById(
          'status'
        ).value,

      featured:
        document.getElementById(
          'featured'
        ).checked,

      created_at:
        new Date().toISOString(),

      updated_at:
        new Date().toISOString()

    };


    let payload;


    if(currentType === 'E-book'){

      payload = {

        ...base,

        description:
          document.getElementById(
            'content'
          ).value.trim(),

        file_url:
          document.getElementById(
            'fileUrl'
          ).value.trim(),

        cover_url:
          document.getElementById(
            'imageUrl'
          ).value.trim()

      };

    }

    else if(currentType === 'Achievement'){

      payload = {

        ...base,

        description:
          document.getElementById(
            'content'
          ).value.trim(),

        file_url:
          document.getElementById(
            'fileUrl'
          ).value.trim(),

        image_url:
          document.getElementById(
            'imageUrl'
          ).value.trim()

      };

    }

    else{

      payload = {

        ...base,

        content:
          document.getElementById(
            'content'
          ).value.trim(),

        cover_url:
          document.getElementById(
            'imageUrl'
          ).value.trim()

      };

    }


    const table =
      tables[currentType];

    let result;


    if(editingId){

      delete payload.created_at;

      result =
        await db
          .from(table)
          .update(payload)
          .eq('id', editingId);

    }

    else{

      result =
        await db
          .from(table)
          .insert(payload);

    }


    if(result.error){

      showMessage(
        result.error.message,
        true
      );

    }

    else{

      showMessage(
        editingId
          ? 'Updated successfully.'
          : 'Added successfully.'
      );

      resetForm();

      await loadData();

    }


    saveBtn.disabled = false;

    saveBtn.textContent =
      'Save';

  }
);


/* =========================================
   DELETE
========================================= */

window.deleteItem =
async function(id){

  const table =
    tables[currentType];

  const item =
    allData.find(
      x => x.id === id
    );

  if(!item) return;


  if(!confirm(
    `Delete "${item.title}"?`
  )) return;


  const { error } =
    await db
      .from(table)
      .delete()
      .eq('id', id);


  if(error){

    showMessage(
      error.message,
      true
    );

    return;
  }


  showMessage(
    'Deleted successfully.'
  );

  await loadData();

};


/* =========================================
   RESET
========================================= */

function resetForm(){

  editingId = null;

  document.getElementById(
    'contentForm'
  ).reset();

  document.getElementById(
    'formTitle'
  ).textContent =
    'Add New Content';

  document.getElementById(
    'cancelBtn'
  ).classList.add('hidden');

  document.getElementById(
    'status'
  ).value =
    'draft';

}


/* =========================================
   CANCEL
========================================= */

document.getElementById(
  'cancelBtn'
).addEventListener(
  'click',
  resetForm
);


/* =========================================
   SEARCH
========================================= */

document.getElementById(
  'search'
).addEventListener(
  'input',
  renderData
);


/* =========================================
   FILTER
========================================= */

document.getElementById(
  'listFilter'
).addEventListener(
  'change',
  e => {

    currentType =
      e.target.value;

    document.querySelectorAll(
      '.tab'
    ).forEach(tab => {

      tab.classList.toggle(
        'active',
        tab.dataset.type === currentType
      );

    });

    resetForm();

    loadData();

  }
);


/* =========================================
   COUNTS
========================================= */

async function updateCounts(){

  const configs = [

    ['writings','writingCount'],

    ['ebooks','ebookCount'],

    ['achievements','achievementCount'],

    ['journal_posts','journalCount']

  ];


  for(const [table,id] of configs){

    const { count } =
      await db
        .from(table)
        .select('*',{
          count:'exact',
          head:true
        });

    document.getElementById(id)
      .textContent =
        count ?? 0;

  }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(
  text,
  error=false
){

  const el =
    document.getElementById(
      'message'
    );

  el.textContent = text;

  el.style.color =
    error
      ? 'var(--danger)'
      : 'var(--accent)';

  setTimeout(() => {

    el.textContent = '';

  },4000);

}


/* =========================================
   ESCAPE
========================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll(
      "'",
      '&#039;'
    );

}


/* =========================================
   LOGOUT
========================================= */

document.getElementById(
  'logoutBtn'
).addEventListener(
  'click',
  async () => {

    await db.auth.signOut();

    window.location.href =
      'admin-login.html';

  }
);


/* =========================================
   DARK MODE
========================================= */

document.getElementById(
  'themeBtn'
).addEventListener(
  'click',
  () => {

    document.body.classList.toggle(
      'dark'
    );

    localStorage.setItem(
      'anamigam-theme',
      document.body.classList.contains(
        'dark'
      )
      ? 'dark'
      : 'light'
    );

  }
);


if(
  localStorage.getItem(
    'anamigam-theme'
  ) === 'dark'
){

  document.body.classList.add(
    'dark'
  );

}


/* =========================================
   START
========================================= */

(async function(){

  const authenticated =
    await checkAuth();

  if(!authenticated)
    return;

  await loadData();

})();

</script>

</body>
                   </html>
