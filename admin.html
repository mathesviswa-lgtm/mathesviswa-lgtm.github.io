<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard — Anamigam Journal</title>

<link rel="icon" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Georgia,"Times New Roman",serif;
  background:#f7f3ea;
  color:#20251b;
}

body.dark{
  background:#171914;
  color:#eee;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 6%;
  border-bottom:1px solid #ddd5c5;
  background:#f7f3ea;
}

.dark header{
  background:#171914;
  border-color:#33382d;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:bold;
  letter-spacing:2px;
}

.logo img{
  width:48px;
  height:48px;
  object-fit:contain;
}

.header-buttons{
  display:flex;
  gap:12px;
}

button{
  border:0;
  padding:12px 20px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
}

.theme-btn{
  background:transparent;
  border:1px solid #cfc7b7;
}

.logout{
  background:#fff;
  color:#9a4f4f;
  border:1px solid #d8caca;
}

.dark .logout{
  background:#252820;
  color:#ffaaaa;
}

.container{
  width:min(1100px,92%);
  margin:40px auto;
}

h1{
  font-size:42px;
  margin-bottom:8px;
}

.subtitle{
  color:#777;
  margin-bottom:35px;
}

.dark .subtitle{
  color:#aaa;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:30px;
}

.stat{
  background:#fffdf8;
  border:1px solid #ddd6c8;
  border-radius:18px;
  padding:20px;
}

.dark .stat,
.dark .card{
  background:#20231d;
  border-color:#363a30;
}

.stat strong{
  display:block;
  font-size:28px;
  margin-top:5px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:25px;
}

.tab{
  background:#e9e4d8;
  color:#333;
}

.tab.active{
  background:#697a53;
  color:white;
}

.dark .tab{
  background:#2b3027;
  color:#eee;
}

.card{
  background:#fffdf8;
  border:1px solid #ddd6c8;
  border-radius:22px;
  padding:28px;
  margin-bottom:30px;
}

.card h2{
  margin-top:0;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.field{
  margin-bottom:20px;
}

.field.full{
  grid-column:1/-1;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
  font-size:17px;
}

input,
textarea,
select{
  width:100%;
  padding:15px;
  border-radius:14px;
  border:1px solid #d7d0c2;
  background:#f9f6ef;
  font-size:16px;
  font-family:inherit;
  color:inherit;
}

textarea{
  min-height:180px;
  resize:vertical;
}

.dark input,
.dark textarea,
.dark select{
  background:#292d25;
  border-color:#41463a;
}

input[type="file"]{
  padding:12px;
  background:#f0ece2;
  cursor:pointer;
}

.dark input[type="file"]{
  background:#30342c;
}

.upload-box{
  border:1px dashed #a8ad98;
  padding:18px;
  border-radius:16px;
}

.upload-btn{
  margin-top:10px;
  background:#697a53;
  color:#fff;
}

.url-field{
  margin-top:12px;
}

.readonly{
  opacity:.8;
}

.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.save-btn{
  background:#697a53;
  color:white;
}

.cancel-btn{
  background:#ddd8cd;
}

.dark .cancel-btn{
  background:#363a31;
  color:#fff;
}

.content-list{
  display:grid;
  gap:15px;
}

.item{
  border:1px solid #ddd6c8;
  border-radius:16px;
  padding:18px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.dark .item{
  border-color:#3a3f34;
}

.item-info{
  flex:1;
}

.item-info h3{
  margin:0 0 7px;
}

.item-info small{
  color:#777;
}

.dark .item-info small{
  color:#aaa;
}

.item-actions{
  display:flex;
  gap:8px;
}

.edit-btn{
  background:#dce5d1;
}

.delete-btn{
  background:#f1d7d7;
  color:#8b3030;
}

.message{
  padding:14px;
  border-radius:12px;
  margin-bottom:20px;
  display:none;
}

.success{
  background:#dfead7;
  color:#36522b;
}

.error{
  background:#f2dada;
  color:#7a2828;
}

.dark .success{
  background:#293c25;
  color:#c9e7bc;
}

.dark .error{
  background:#432727;
  color:#ffc2c2;
}

@media(max-width:700px){

  header{
    padding:18px 4%;
  }

  .logo{
    font-size:13px;
  }

  .logo img{
    width:40px;
    height:40px;
  }

  h1{
    font-size:32px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .item{
    flex-direction:column;
    align-items:flex-start;
  }

  .item-actions{
    width:100%;
  }

  .item-actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
<img src="logo.png" alt="Anamigam Journal">
<span>ANAMIGAM JOURNAL — ADMIN</span>
</div>

<div class="header-buttons">
<button class="theme-btn" onclick="toggleTheme()">☾</button>
<button class="logout" onclick="logout()">Logout</button>
</div>

</header>

<main class="container">

<h1>Admin Dashboard</h1>

<p class="subtitle">
Manage your writings, e-books, achievements and journal.
</p>

<div id="message" class="message"></div>

<div class="stats">

<div class="stat">
Writings
<strong id="writingCount">0</strong>
</div>

<div class="stat">
E-books
<strong id="ebookCount">0</strong>
</div>

<div class="stat">
Achievements
<strong id="achievementCount">0</strong>
</div>

<div class="stat">
Journal
<strong id="journalCount">0</strong>
</div>

</div>

<div class="tabs">

<button class="tab active" data-type="writings">
✍️ Writings
</button>

<button class="tab" data-type="ebooks">
📚 E-books
</button>

<button class="tab" data-type="achievements">
🏆 Achievements
</button>

<button class="tab" data-type="journal_posts">
📰 Journal
</button>

</div>

<section class="card">

<h2 id="formTitle">Add New Content</h2>

<form id="contentForm">

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">

<label>Title</label>

<input
type="text"
id="title"
required
placeholder="Enter title">

</div>

<div class="field">

<label>Author</label>

<input
type="text"
id="author"
value="வி.மாதேஸ்வரன்"
placeholder="Author">

</div>

<div class="field">

<label>Category</label>

<select id="category">

<option value="கவிதை">கவிதை</option>
<option value="சிறுகதை">சிறுகதை</option>
<option value="சிந்தனை">சிந்தனை</option>
<option value="கட்டுரை">கட்டுரை</option>
<option value="Psychology">Psychology</option>
<option value="Self-Discovery">Self-Discovery</option>
<option value="Other">Other</option>

</select>

</div>

<div class="field">

<label>Status</label>

<select id="status">

<option value="published">Published</option>
<option value="draft">Draft</option>

</select>

</div>

<div class="field full">

<label>Description / Content</label>

<textarea
id="content"
placeholder="Write your content here..."></textarea>

</div>

<div class="field full">

<label>📄 PDF / File Upload</label>

<div class="upload-box">

<input
type="file"
id="fileUpload"
accept=".pdf,.doc,.docx,.txt">

<button
type="button"
class="upload-btn"
onclick="uploadFile()">

⬆️ Upload File

</button>

<input
type="text"
id="fileUrl"
class="url-field readonly"
readonly
placeholder="Uploaded file URL will appear here">

</div>

</div>

<div class="field full">

<label>🖼️ Cover / Image Upload</label>

<div class="upload-box">

<input
type="file"
id="imageUpload"
accept="image/*">

<button
type="button"
class="upload-btn"
onclick="uploadImage()">

⬆️ Upload Image

</button>

<input
type="text"
id="imageUrl"
class="url-field readonly"
readonly
placeholder="Uploaded image URL will appear here">

</div>

</div>

<div class="field full">

<label>

<input
type="checkbox"
id="featured"
style="width:auto;margin-right:8px;">

Featured

</label>

</div>

</div>

<div class="actions">

<button
type="submit"
class="save-btn">

💾 Save

</button>

<button
type="button"
class="cancel-btn"
onclick="resetForm()">

Cancel

</button>

</div>

</form>

</section>

<section class="card">

<h2>Manage Content</h2>

<input
type="search"
id="search"
placeholder="Search content..."
style="margin-bottom:20px;">

<div
id="contentList"
class="content-list">
</div>

</section>

</main>

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  'https://tscmbnaystpjioflkeey.supabase.co';

const SUPABASE_ANON_KEY =
  'msgwhxeqnljmbzalnawe';


/* =========================================
   SUPABASE CLIENT
   PUBLIC SCHEMA EXPLICITLY SET
========================================= */

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY,
{
db:{
schema:'public'
}
}
);


/* =========================================
   TABLES
========================================= */

let currentType='writings';

const tableNames={

writings:'writings',

ebooks:'ebooks',

achievements:'achievements',

journal_posts:'journal_posts'

};


/* =========================================
   LOGIN CHECK
========================================= */

async function checkLogin(){

const {
data:{user}
}=await db.auth.getUser();

if(!user){

window.location.href='admin-login.html';

return false;
}

return true;

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

const box=
document.getElementById('message');

box.textContent=text;

box.className='message '+type;

box.style.display='block';

setTimeout(()=>{

box.style.display='none';

},4000);

}


/* =========================================
   STORAGE UPLOAD
========================================= */

async function uploadToStorage(file,type){

if(!file){

throw new Error(
'Please choose a file first.'
);

}

const {
data:{user}
}=await db.auth.getUser();

if(!user){

throw new Error(
'Please login again.'
);

}

const safeName=
file.name.replace(
/[^a-zA-Z0-9._-]/g,
'_'
);

const folder=
type==='image'
?'images'
:'files';

const filePath=
folder+
'/'+
Date.now()+
'_'+
safeName;

const {error}=await db.storage
.from('anamigam-files')
.upload(
filePath,
file,
{
upsert:false
}
);

if(error){

throw error;

}

const {data}=
db.storage
.from('anamigam-files')
.getPublicUrl(filePath);

return data.publicUrl;

}


/* =========================================
   FILE UPLOAD
========================================= */

async function uploadFile(){

const input=
document.getElementById(
'fileUpload'
);

const file=input.files[0];

if(!file){

showMessage(
'Please choose a PDF / file first.',
'error'
);

return;

}

try{

showMessage(
'Uploading file...',
'success'
);

const url=
await uploadToStorage(
file,
'file'
);

document.getElementById(
'fileUrl'
).value=url;

showMessage(
'✅ File uploaded successfully!',
'success'
);

}catch(error){

console.error(error);

showMessage(
'❌ Upload failed: '+
error.message,
'error'
);

}

}


/* =========================================
   IMAGE UPLOAD
========================================= */

async function uploadImage(){

const input=
document.getElementById(
'imageUpload'
);

const file=input.files[0];

if(!file){

showMessage(
'Please choose an image first.',
'error'
);

return;

}

try{

showMessage(
'Uploading image...',
'success'
);

const url=
await uploadToStorage(
file,
'image'
);

document.getElementById(
'imageUrl'
).value=url;

showMessage(
'✅ Image uploaded successfully!',
'success'
);

}catch(error){

console.error(error);

showMessage(
'❌ Image upload failed: '+
error.message,
'error'
);

}

}


/* =========================================
   LOAD CONTENT
========================================= */

async function loadContent(){

const table=
tableNames[currentType];

const {
data,
error
}=await db
.from(table)
.select('*')
.order(
'created_at',
{
ascending:false
}
);

if(error){

console.error(error);

showMessage(
error.message,
'error'
);

return;

}

renderContent(data||[]);

}


/* =========================================
   RENDER
========================================= */

function renderContent(items){

const list=
document.getElementById(
'contentList'
);

const search=
document.getElementById(
'search'
).value.toLowerCase();

const filtered=
items.filter(item=>{

const title=
(item.title||'').toLowerCase();

const category=
(item.category||'').toLowerCase();

return(
title.includes(search)||
category.includes(search)
);

});

if(!filtered.length){

list.innerHTML=
'<p>No content found.</p>';

return;

}

list.innerHTML=
filtered.map(item=>`

<div class="item">

<div class="item-info">

<h3>
${escapeHtml(item.title||'Untitled')}
</h3>

<small>
${escapeHtml(item.category||'')}
•
${escapeHtml(item.status||'')}
</small>

</div>

<div class="item-actions">

<button
class="edit-btn"
onclick="editContent('${item.id}')">

Edit

</button>

<button
class="delete-btn"
onclick="deleteContent('${item.id}')">

Delete

</button>

</div>

</div>

`).join('');

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

return String(value)
.replace(/&/g,'&amp;')
.replace(/</g,'&lt;')
.replace(/>/g,'&gt;')
.replace(/"/g,'&quot;')
.replace(/'/g,'&#039;');

}


/* =========================================
   SAVE
========================================= */

document
.getElementById('contentForm')
.addEventListener(
'submit',
async function(e){

e.preventDefault();

const table=
tableNames[currentType];

const id=
document.getElementById(
'editId'
).value;

const baseData={

title:
document.getElementById(
'title'
).value.trim(),

author:
document.getElementById(
'author'
).value.trim(),

category:
document.getElementById(
'category'
).value,

status:
document.getElementById(
'status'
).value,

featured:
document.getElementById(
'featured'
).checked

};


if(
currentType==='writings'||
currentType==='journal_posts'
){

baseData.content=
document.getElementById(
'content'
).value;

}


if(
currentType==='ebooks'||
currentType==='achievements'
){

baseData.description=
document.getElementById(
'content'
).value;

}


if(currentType==='ebooks'){

baseData.file_url=
document.getElementById(
'fileUrl'
).value.trim();

baseData.cover_url=
document.getElementById(
'imageUrl'
).value.trim();

}


if(currentType==='achievements'){

baseData.file_url=
document.getElementById(
'fileUrl'
).value.trim();

baseData.image_url=
document.getElementById(
'imageUrl'
).value.trim();

}


if(currentType==='writings'){

baseData.cover_url=
document.getElementById(
'imageUrl'
).value.trim();

}


if(currentType==='journal_posts'){

baseData.cover_url=
document.getElementById(
'imageUrl'
).value.trim();

}


let result;

if(id){

result=
await db
.from(table)
.update(baseData)
.eq('id',id);

}else{

result=
await db
.from(table)
.insert(baseData);

}


if(result.error){

console.error(result.error);

showMessage(
'❌ Save failed: '+
result.error.message,
'error'
);

return;

}


showMessage(
'✅ Saved successfully!',
'success'
);

resetForm();

await loadContent();

await loadStats();

}
);


/* =========================================
   EDIT
========================================= */

async function editContent(id){

const table=
tableNames[currentType];

const {
data,
error
}=await db
.from(table)
.select('*')
.eq('id',id)
.single();

if(error){

showMessage(
error.message,
'error'
);

return;

}

document.getElementById(
'editId'
).value=data.id;

document.getElementById(
'title'
).value=data.title||'';

document.getElementById(
'author'
).value=data.author||'';

document.getElementById(
'category'
).value=data.category||'Other';

document.getElementById(
'status'
).value=data.status||'published';

document.getElementById(
'content'
).value=
data.content||
data.description||
'';

document.getElementById(
'featured'
).checked=
!!data.featured;

document.getElementById(
'fileUrl'
).value=
data.file_url||'';

document.getElementById(
'imageUrl'
).value=
data.cover_url||
data.image_url||
'';

document.getElementById(
'formTitle'
).textContent=
'Edit Content';

window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* =========================================
   DELETE
========================================= */

async function deleteContent(id){

if(!confirm(
'இந்த content-ஐ delete செய்யவா?'
)){

return;

}

const table=
tableNames[currentType];

const {error}=
await db
.from(table)
.delete()
.eq('id',id);

if(error){

showMessage(
'❌ Delete failed: '+
error.message,
'error'
);

return;

}

showMessage(
'✅ Deleted successfully!',
'success'
);

await loadContent();

await loadStats();

}


/* =========================================
   RESET
========================================= */

function resetForm(){

document
.getElementById('contentForm')
.reset();

document.getElementById(
'editId'
).value='';

document.getElementById(
'author'
).value='வி.மாதேஸ்வரன்';

document.getElementById(
'formTitle'
).textContent=
'Add New Content';

document.getElementById(
'fileUrl'
).value='';

document.getElementById(
'imageUrl'
).value='';

}


/* =========================================
   TABS
========================================= */

document
.querySelectorAll('.tab')
.forEach(button=>{

button.addEventListener(
'click',
function(){

document
.querySelectorAll('.tab')
.forEach(b=>
b.classList.remove('active')
);

this.classList.add('active');

currentType=
this.dataset.type;

resetForm();

loadContent();

}
);

});


/* =========================================
   SEARCH
========================================= */

document
.getElementById('search')
.addEventListener(
'input',
loadContent
);


/* =========================================
   STATS
========================================= */

async function loadStats(){

for(
const type of Object.keys(tableNames)
){

const {count}=
await db
.from(tableNames[type])
.select(
'*',
{
count:'exact',
head:true
}
);

const id=
type==='writings'
?'writingCount'
:type==='ebooks'
?'ebookCount'
:type==='achievements'
?'achievementCount'
:'journalCount';

document.getElementById(id)
.textContent=count||0;

}

}


/* =========================================
   DARK MODE
========================================= */

function toggleTheme(){

document.body
.classList
.toggle('dark');

localStorage.setItem(
'anamigam-theme',
document.body.classList.contains('dark')
?'dark'
:'light'
);

}

if(
localStorage.getItem(
'anamigam-theme'
)==='dark'
){

document.body
.classList
.add('dark');

}


/* =========================================
   LOGOUT
========================================= */

async function logout(){

await db.auth.signOut();

window.location.href=
'admin-login.html';

}


/* =========================================
   START
========================================= */

(async function(){

const loggedIn=
await checkLogin();

if(!loggedIn)return;

await loadContent();

await loadStats();

})();

</script>

</body>
  </html>
